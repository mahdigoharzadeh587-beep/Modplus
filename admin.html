<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت مدplus</title><link rel="stylesheet" href="admin.css"></head><body><header><a href="index.html">← فروشگاه</a><h1>پنل مدیریت مدplus</h1></header><main><section class="panel"><h2>افزودن محصول</h2><div class="form"><input id="name" placeholder="نام محصول"><input id="cat" placeholder="دسته‌بندی"><input id="price" type="number" placeholder="قیمت"><input id="icon" placeholder="ایموجی" value="👗"><input id="sizes" placeholder="سایزها: S,M,L"><input id="colors" placeholder="رنگ‌ها: مشکی,سفید"><button onclick="addProduct()">افزودن محصول</button></div></section><section class="panel"><h2>محصولات</h2><div id="list"></div></section></main><script>let ps=JSON.parse(localStorage.getItem("modplus_products")||"null")||[];function load(){document.getElementById("list").innerHTML=ps.map((p,i)=>`<div class="row"><span>${p.icon} ${p.name}<small>${p.cat} · ${p.price.toLocaleString("fa-IR")} تومان</small></span><button onclick="del(${i})">حذف</button></div>`).join("")||"<p>محصولی اضافه نشده.</p>"}function addProduct(){let n=name.value,c=cat.value,pr=Number(price.value),ic=icon.value||"👗",sz=sizes.value.split(",").map(x=>x.trim()).filter(Boolean),co=colors.value.split(",").map(x=>x.trim()).filter(Boolean);if(!n||!c||!pr)return alert("نام، دسته‌بندی و قیمت را وارد کن.");ps.push({id:Date.now(),name:n,cat:c,price:pr,icon:ic,sizes:sz.length?sz:["Free"],colors:co.length?co:["پیش‌فرض"]});localStorage.setItem("modplus_products",JSON.stringify(ps));location.reload()}function del(i){ps.splice(i,1);localStorage.setItem("modplus_products",JSON.stringify(ps));load()}load();</script></body></html>
